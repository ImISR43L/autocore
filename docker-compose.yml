version: "3.8"

services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    # O container da API carrega o arquivo .env da pasta ./api
    env_file:
      - ./api/.env
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
    volumes:
      #- ./api:/app
      - /app/node_modules

  db:
    image: postgres:13
    # Mapeamos as variáveis do .env da API para as do Postgres
    environment:
      POSTGRES_USER: autocore_user # Hardcoded para garantir ou use ${DB_USER} se tiver um .env na raiz
      POSTGRES_PASSWORD: autocore_password
      POSTGRES_DB: autocore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./web
    ports:
      - "8080:80"
    env_file:
      - ./web/.env
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src

volumes:
  postgres_data:
