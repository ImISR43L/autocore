services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
      go-judge:
        condition: service_started # Mudamos a dependência

    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
    volumes:
      - ./api:/app
      - /app/node_modules

    command: sh -c "npm install && npm run start:dev"
    extra_hosts:
      - "go-judge:host-gateway"

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: autocore_user
      POSTGRES_PASSWORD: autocore_password
      POSTGRES_DB: autocore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocore_user -d autocore_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./web
    ports:
      - "8080:80"
    env_file:
      - ./web/.env
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src

  go-judge:
    build: ./judge
    ports:
      - "5050:5050"
    restart: always
    privileged: true
    shm_size: "512mb" # Essencial para Java/Node/Python
    security_opt:
      - seccomp:unconfined

volumes:
  postgres_data:
