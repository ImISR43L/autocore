services:
  api:
    build: ./api
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
      go-judge:
        condition: service_started
      redis:
        condition: service_started

    # CONECTA A API ÀS DUAS REDES
    networks:
      - default # Acesso à Internet, DB e Web
      - secure_sandbox # Acesso exclusivo ao Juiz

    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/src
        - action: rebuild
          path: ./api/package.json
    volumes:
      - ./api:/app
      - /app/node_modules

    command: sh -c "npm install && npm run start:dev"

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: autocore_user
      POSTGRES_PASSWORD: autocore_password
      POSTGRES_DB: autocore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocore_user -d autocore_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  go-judge:
    image: go-judge-custom
    build: ./judge
    # REMOVIDO: ports (O isolamento exige que não expenhamos a porta ao host)
    # ports:
    #   - "5050:5050"

    networks:
      - secure_sandbox # Apenas rede interna, sem internet

    # Configurações de Segurança/Performance (Mantidas das correções anteriores)
    privileged: true
    shm_size: "512mb"
    security_opt:
      - seccomp:unconfined

  web:
    build: ./web
    ports:
      - "8080:80"
    env_file:
      - ./web/.env
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: sync
          path: ./web/public
          target: /app/public
        - action: rebuild
          path: ./web/package.json

# DEFINIÇÃO DAS REDES
networks:
  default:
    driver: bridge
  secure_sandbox:
    internal: true # Bloqueia acesso externo (Internet)

volumes:
  postgres_data:
  redis_data:
