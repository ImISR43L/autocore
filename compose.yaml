services:
  api:
    build:
      context: ./api
      target: builder
    # Mantivemos TTY e Init para melhor controle
    tty: true
    init: true
    ports:
      - "3000:3000"
      - "9229:9229" # Porta de Debug
    env_file:
      - ./api/.env
    environment:
      - REDIS_HOST=redis
      - EXECUTOR_URL=http://go-judge:5050/run
      - NODE_ENV=development
    secrets:
      - redis_password
      - jwt_secret
    # CORREÇÃO 1: Voltamos com o comando de inicialização
    command: npm run start:dev
    develop:
      watch:
        # Regra 1: Sincronizar código (Rápido)
        - action: sync
          path: ./api
          target: /app
          ignore:
            - node_modules/
            - dist/

        # Regra 2: Reconstruir container se mudar dependências (Lento, mas necessário)
        - action: rebuild
          path: ./api/package.json
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      go-judge:
        condition: service_started
    networks:
      - backend_net
      - secure_sandbox
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1.5G

  redis:
    image: redis:alpine
    # Mantivemos o Healthcheck (é uma boa prática)
    command: >
      sh -c "redis-server --requirepass $(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  go-judge:
    image: go-judge-custom
    build: ./judge
    networks:
      - secure_sandbox
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
      - /run:exec,mode=1777
    cap_add:
      - SYS_ADMIN
      - SETUID
      - SETGID
      - SYS_PTRACE
      - DAC_OVERRIDE
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    shm_size: "512mb"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    restart: on-failure

  web:
    build:
      context: ./web
      target: development
    ports:
      - "8080:5173"
    env_file:
      - ./web/.env
    command: npm run dev -- --host
    networks:
      - backend_net
    develop:
      watch:
        - action: sync
          path: ./web
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./web/package.json
    volumes:
      - ./web:/app # <--- Isso espelha sua pasta local para dentro do container
      - /app/node_modules

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

networks:
  backend_net:
    driver: bridge
  secure_sandbox:
    driver: bridge
    internal: true

volumes:
  redis_data:
