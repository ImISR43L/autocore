services:
  api:
    build:
      context: ./api
      target: builder # <--- ISSO É CRUCIAL: Usa a etapa da imagem que tem o 'nest' instalado
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - EXECUTOR_URL=http://go-judge:5050/run
      - NODE_ENV=development
    secrets:
      - db_password
      - redis_password
      - jwt_secret
    depends_on:
      db:
        condition: service_healthy
      go-judge:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./api:/app # Garante que seus logs no código apareçam no container
      - /app/node_modules # Preserva os módulos do container
    command: npm run start:dev
    networks:
      - backend_net
      - secure_sandbox
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: 1G

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: autocore_user
      POSTGRES_DB: autocore_db
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocore_user -d autocore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    command: >
      sh -c "redis-server --requirepass $(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  go-judge:
    image: go-judge-custom
    build: ./judge
    networks:
      - secure_sandbox
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
      - /run:exec,mode=1777
    privileged: true
    shm_size: "512mb"
    security_opt:
      - seccomp:unconfined
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  web:
    build: ./web
    ports:
      - "8080:80"
    env_file:
      - ./web/.env
    networks:
      - backend_net

# Definição dos Segredos (Aponta para os arquivos criados no Passo 1)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

networks:
  backend_net:
    driver: bridge
  secure_sandbox:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
