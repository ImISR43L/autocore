name: Security Audit & Integrity

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 1' # Roda toda segunda-feira à meia-noite (monitoramento contínuo)

jobs:
  audit-backend:
    name: Audit API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './api/package-lock.json'

      - name: Install Dependencies
        run: npm ci --ignore-scripts # 'ci' é mais seguro e rápido para pipelines

      - name: Run NPM Audit
        # Falha se encontrar vulnerabilidades de nível ALTO ou CRÍTICO
        run: npm audit --audit-level=high

  audit-frontend:
    name: Audit Web (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run NPM Audit
        run: npm audit --audit-level=high