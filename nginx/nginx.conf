events {
    worker_connections 1024;
}

http {
    # Ocultar versão do Nginx
    server_tokens off;

    # Otimizações de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Definição de Upstream para a API local
    upstream backend_api {
        server api:3000;
    }

    # Redirecionamento forçado de HTTP para HTTPS
    server {
        listen 80;
        server_name api.autocore.com; # Substituir pelo domínio em produção

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.autocore.com;

        # Montagem dos certificados (Requisito de Produção)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Protocolos e Cifras Restritas (Endurecimento SSL)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        # Cabeçalhos de Segurança (HSTS)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Suporte a WebSockets (Necessário para o Gateway de Submissões)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}